# QuickNovel LLM fix server config.
# HOT-RELOADED on change (no restart) — edit while the server runs and it picks it up.
# Copy to config.yaml and edit for your setup.

# Ollama base URL for LOCAL runs. In Docker, compose overrides this with the OLLAMA_BASE_URL env
# (http://host.docker.internal:11434) so the container reaches the host's Ollama.
ollama_base_url: "http://localhost:11434"

# gemma2-2b gives the most FAITHFUL rewrites (others hallucinate/leak/refuse). ~3.6 GB loaded so
# ~half spills to CPU on a 4 GB GPU, still ~53 tok/s GPU / ~21 CPU-only. qwen2.5-1.5b is faster
# (100% GPU, ~65 tok/s) but embellishes. Switch to taste.
default_model: "gemma2-2b"

# Rewrite chapters in chunks of this many characters (must fit num_ctx with room to generate).
chunk_chars: 2200
# Model context window. Smaller = smaller KV cache = more of the model fits on the GPU = faster.
num_ctx: 2048
# Send the previous chapters as context (better pronoun consistency, but a bigger/slower prompt).
send_previous_chapters: false

# When true, every input/output pair is appended to samples/samples.jsonl for testing.
# Toggle at runtime WITHOUT restart: edit this file, or POST /config/store_samples?on=true
store_samples: false

# Sampling — server models can use a real repeat penalty (unlike the on-device binding).
temperature: 0.4
frequency_penalty: 0.3
presence_penalty: 0.1

# ---- Cloud (OpenCode Zen, OpenAI-compatible) ----
# Key goes in server/.env as OPENCODE_API_KEY=... (untracked); compose interpolates it.
opencode:
  api_base: "https://opencode.ai/zen/go/v1"
  api_key_env: "OPENCODE_API_KEY"

# Per-task model routing: which model handles which job kind, with a local fallback used when the
# cloud is unreachable / key missing / budget cap hit. Explicit `model` in a request overrides.
tasks:
  grammar_fix:        { model: "oc-glm-5.2",   fallback: "gemma2-2b" }
  performance_script: { model: "oc-deepseek-v4-flash", fallback: "gemma2-2b" }
  character_summary:  { model: "oc-glm-5.2",        fallback: "oc-deepseek-v4-flash" }

# Daily cloud spend guardrail (approximate: token counts x configured prices; models without prices
# count $0 and rely on the provider's own quota/429 -> fallback).
cloud_budget:
  daily_usd_cap: 2.00
  on_cap: fallback         # fallback | reject
  cooldown_s: 600          # circuit-breaker after cloud errors
  quota_cooldown_s: 1800   # longer back-off on 429/quota

# Models offered to the app (GET /models). `litellm` is the LiteLLM model string.
# kind: local (Ollama) | cloud (OpenAI-compatible; needs api_key_env).
# NOTE (measured with the real grammar prompt, July 2026): glm-5.2 4.2s, minimax-m2.7 7.0s,
# deepseek-v4-flash 8.6s — all excellent. AVOID reasoning models for prose (qwen3.7-plus burns
# minutes "thinking" and times out); kimi-k2.7-code 400s on prose params.
models:
  - id: "oc-glm-5.2"
    name: "GLM 5.2 (OpenCode · cloud)"
    litellm: "openai/glm-5.2"
    kind: "cloud"
  - id: "oc-deepseek-v4-flash"
    name: "DeepSeek V4 Flash (OpenCode · cloud)"
    litellm: "openai/deepseek-v4-flash"
    kind: "cloud"
  - id: "oc-minimax-m2.7"
    name: "MiniMax M2.7 (OpenCode · cloud)"
    litellm: "openai/minimax-m2.7"
    kind: "cloud"
  - id: "qwen2.5-1.5b"
    name: "Qwen2.5 1.5B Instruct (Ollama · fits 4 GB, fast)"
    litellm: "ollama/qwen2.5:1.5b"
  - id: "llama3.2-1b"
    name: "Llama 3.2 1B (Ollama · fast, CPU-friendly)"
    litellm: "ollama/llama3.2:1b"
  - id: "qwen2.5-0.5b"
    name: "Qwen2.5 0.5B (Ollama · fastest, CPU-friendly)"
    litellm: "ollama/qwen2.5:0.5b"
  - id: "gemma2-2b"
    name: "Gemma 2 2B (Ollama · best quality; ~half on GPU)"
    litellm: "ollama/gemma2:2b"
  - id: "qwen2.5-3b"
    name: "Qwen2.5 3B Instruct (Ollama · needs >4 GB VRAM)"
    litellm: "ollama/qwen2.5:3b"
  - id: "qwen2.5-7b"
    name: "Qwen2.5 7B Instruct (Ollama, GPU)"
    litellm: "ollama/qwen2.5:7b"
  - id: "gemma2-9b"
    name: "Gemma 2 9B (Ollama, GPU)"
    litellm: "ollama/gemma2:9b"
  # Cloud examples — set the provider key as an env var (e.g. OPENAI_API_KEY):
  # - id: "gpt-4o-mini"
  #   name: "GPT-4o mini"
  #   litellm: "openai/gpt-4o-mini"

# Server-side TTS offload (GET/POST /tts/*). Synthesizes the SAME sherpa-onnx models as the app
# (Kitten/Kokoro) so the audio drops straight into the app's on-device cache in the same voice.
tts:
  enabled: true
  # Where downloaded models + generated audio live (also overridable via TTS_MODELS_DIR / TTS_AUDIO_DIR).
  models_dir: "/models"
  audio_dir: "/data/tts-audio"
  provider: "cpu"          # CPU matches on-device + avoids VRAM contention with the LLM. "cuda" opt-in.
  num_threads: 3           # ONNX threads per synthesis (8 streams x 3 = 24 threads, headroom on 32)
  # Parallel synthesis streams = pool of OfflineTts instances (one each; ~40 MB kitten / ~130 MB
  # kokoro per instance, created lazily). 8 suits a 16c/32t box; lower it if RAM is tight.
  max_concurrent: 8
  preload: ["kitten"]      # pre-download these models on startup (download only; engine loads lazily)
